# Braid on Fly.io. One app, one machine, both processes inside it.
#
#   fly launch --no-deploy     # once, to create the app and pick a region
#   fly deploy
#
# The app is stateless: every number it serves comes from files baked into the
# image or from the Rust replica computing one. Nothing is written at runtime,
# so a machine can be replaced at any moment and there is no volume to keep.

app = "braid"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Scale to zero when idle. A cold start is a second or two, and this is a
  # project page rather than something anyone is paging on.
  min_machines_running = 0

  [http_service.http_options.response]
    pristine = true

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  # The optimizer is CPU-bound and the curve chart asks for ~44 plans per
  # request; one shared CPU handles that in a fifth of a second.
  size = "shared-cpu-1x"
  memory = "512mb"
